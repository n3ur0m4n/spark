<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Native sort cone culling parity</title></head><body>
<script type="module">
// Splats surround the camera; sortCullFov drops those outside the view cone.
// WebGL and both native orderings must cull the same splats and render alike.
import * as THREE from 'three';
import {FullScreenQuad} from 'three/addons/postprocessing/Pass.js';
import {WebGPURenderer} from 'three/webgpu';
import {SparkRenderer,SplatMesh,PackedSplats} from '/src/index.ts';
const errors=[],checks=[];
window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
window.addEventListener('error',e=>errors.push(e.message));
const check=(name,ok,data={})=>{checks.push({name,ok,...data});if(!ok)throw Error(`${name}: ${JSON.stringify(data)}`);};
const W=160,H=120,COUNT=20000;

async function runCase(config){
 let seed=11;const random=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296;};
 const native=config.engine!=='webgl';
 const renderer=native?new WebGPURenderer({antialias:false,alpha:true}):new THREE.WebGLRenderer({antialias:false,alpha:true,preserveDrawingBuffer:true});
 if(native)await renderer.init();
 renderer.setPixelRatio(1);renderer.setSize(W,H);document.body.append(renderer.domElement);
 if(native)renderer.backend.device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const scene=new THREE.Scene();scene.background=new THREE.Color(0,0,0);
 const camera=new THREE.PerspectiveCamera(60,W/H,.1,1000);camera.position.set(.1,.2,.3);camera.lookAt(1,.3,-4);camera.updateMatrixWorld();
 const spark=new SparkRenderer({renderer,autoUpdate:native,sortCullFov:config.fov,sortRadial:config.radial,
  webgpuSort:config.engine==='gpu-sort'?'radix':'readback',minSortIntervalMs:0});
 scene.add(spark);
 const packedSplats=new PackedSplats({maxSplats:COUNT,construct:data=>{
  for(let i=0;i<COUNT;i++)data.pushSplat(new THREE.Vector3((random()-.5)*12,(random()-.5)*12,(random()-.5)*12),
   new THREE.Vector3(.02+random()*.08,.02+random()*.08,.02+random()*.08),
   new THREE.Quaternion().setFromEuler(new THREE.Euler(random()*6,random()*6,random()*6)),.3+random()*.6,new THREE.Color(random(),random(),random()));}});
 await packedSplats.initialized;
 const mesh=new SplatMesh({packedSplats});await mesh.initialized;scene.add(mesh);
 const target=native?null:new THREE.WebGLRenderTarget(W,H,{type:THREE.HalfFloatType});
 const quad=target?new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms:{source:{value:target.texture}},depthTest:false,depthWrite:false,blending:THREE.NoBlending,
  vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader:`uniform sampler2D source;varying vec2 vUv;
   void main(){vec4 c=texture2D(source,vUv);vec3 s=c.rgb/max(c.a,1e-6);
    s=mix(12.92*s,1.055*pow(s,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),s));gl_FragColor=vec4(s*c.a,c.a);}`
 })):null;
 const draw=async()=>{
  if(native)await spark.renderAsync(scene,camera);
  else{renderer.setRenderTarget(target);renderer.getDrawingBufferSize(spark.renderSize);await spark.update({scene,camera});
   const until=performance.now()+5000;while(spark.sorting||spark.sortDirty){if(performance.now()>until)throw Error('Sort did not settle');await new Promise(r=>setTimeout(r,1));}
   renderer.render(scene,camera);renderer.setRenderTarget(null);quad.render(renderer);}
 };
 try{
  await draw();await draw();
  // A WebGPU canvas is only readable in the task that presented it.
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const context=canvas.getContext('2d');context.drawImage(renderer.domElement,0,0);
  return {pixels:Array.from(context.getImageData(0,0,W,H).data),activeSplats:spark.activeSplats,stats:native?spark.getRenderStats?.():null};
 }finally{
  if(native)await renderer.backend.device.queue.onSubmittedWorkDone();
  target?.dispose();quad?.material.dispose();quad?.dispose();mesh.dispose();packedSplats.dispose();
  spark.dispose();renderer.dispose();renderer.domElement.remove();
 }
}

const pixelDiff=(a,b)=>{let sum=0,max=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);sum+=d;if(d>max)max=d;}return {mean:sum/a.length,max};};
try{
 const stats=[];
 for(const radial of [true,false]){
  const off=await runCase({engine:'webgl',fov:0,radial});
  for(const fov of [70,30]){
   const label=`sortCullFov ${fov} ${radial?'radial':'depth'}`;
   const [webgl,reference,radix]=[await runCase({engine:'webgl',fov,radial}),await runCase({engine:'webgpu-readback',fov,radial}),await runCase({engine:'gpu-sort',fov,radial})];
   check(`${label}: cone culls splats`,webgl.activeSplats>0&&webgl.activeSplats<off.activeSplats,{culled:webgl.activeSplats,all:off.activeSplats});
   check(`${label}: native culls the same splats`,reference.activeSplats===webgl.activeSplats,{webgl:webgl.activeSplats,native:reference.activeSplats});
   check(`${label}: native orderings render identically`,pixelDiff(reference.pixels,radix.pixels).max===0);
   const diff=pixelDiff(webgl.pixels,reference.pixels);
   stats.push({label,drawn:webgl.activeSplats,all:off.activeSplats,diff});
   check(`${label}: WebGPU renders like WebGL`,diff.mean<1,{diff});
  }
 }
 window.lifecycleResult={passed:errors.length===0,checks,errors,stats};
}catch(error){window.lifecycleResult={passed:false,checks,errors,error:String(error)};}
</script></body></html>
