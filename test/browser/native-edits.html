<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Native SDF edit parity</title></head><body>
<script type="module">
// Applies mesh-local and global SplatEdit SDF layers (every SDF type and blend
// mode, hard/soft edges, smooth unions, inversion, displacement) through WebGL
// and both native WebGPU orderings, then compares the generated splats and the
// rendered pixels, before and after the edits move.
import * as THREE from 'three';
import {FullScreenQuad} from 'three/addons/postprocessing/Pass.js';
import {WebGPURenderer} from 'three/webgpu';
import {SparkRenderer,SplatMesh,PackedSplats,ExtSplats,SplatEdit,SplatEditSdf,SplatEditSdfType as T,SplatEditRgbaBlendMode as B,utils} from '/src/index.ts';
const errors=[],checks=[];
window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
window.addEventListener('error',e=>errors.push(e.message));
const check=(name,ok,data={})=>{checks.push({name,ok,...data});if(!ok)throw Error(`${name}: ${JSON.stringify(data)}`);};
const W=160,H=120,COUNT=4000;

async function readBuffer(device,source,bytes){
 const destination=device.createBuffer({size:Math.max(4,bytes),usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
 try{const encoder=device.createCommandEncoder();encoder.copyBufferToBuffer(source,0,destination,0,bytes);
  device.queue.submit([encoder.finish()]);await destination.mapAsync(GPUMapMode.READ);
  const result=new Uint32Array(destination.getMappedRange().slice(0,bytes));destination.unmap();return result;}
 finally{destination.destroy();}
}

function buildEdits(scene,meshes){
 const sdf=(options,position,rotation,scale)=>{const s=new SplatEditSdf(options);s.position.set(...position);
  if(rotation)s.rotation.set(...rotation);if(scale)s.scale.set(...scale);return s;};
 // Mesh-local: multiply inside a soft sphere, hard inverted plane.
 const local=new SplatEdit({rgbaBlendMode:B.MULTIPLY,softEdge:.3});
 local.add(sdf({type:T.SPHERE,radius:.6,color:new THREE.Color(1,.2,.2),opacity:.5},[.2,0,0]));
 meshes[0].add(local);
 const plane=new SplatEdit({rgbaBlendMode:B.ADD_RGBA,invert:true});
 plane.add(sdf({type:T.PLANE,color:new THREE.Color(0,.3,0),opacity:0},[0,0,-.4],[.3,0,0]));
 meshes[1].add(plane);
 // Global: smooth union of a rounded box and an inverted ellipsoid with displacement.
 const union=new SplatEdit({rgbaBlendMode:B.SET_RGB,sdfSmooth:.15,softEdge:.1});
 union.add(sdf({type:T.BOX,radius:.05,color:new THREE.Color(.1,.4,.9),displace:new THREE.Vector3(0,.15,0)},[-.6,.2,0],[0,.4,.2],[.5,.4,.6]));
 union.add(sdf({type:T.ELLIPSOID,invert:true,color:new THREE.Color(.9,.9,.1),opacity:.7,displace:new THREE.Vector3(.1,0,0)},[.8,0,.2],null,[.7,.4,.5]));
 scene.add(union);
 // Global: hard union of cylinder, capsule and infinite cone, then everything.
 const shapes=new SplatEdit({rgbaBlendMode:B.ADD_RGBA,softEdge:.05});
 shapes.add(sdf({type:T.CYLINDER,radius:.25,color:new THREE.Color(.3,0,.3),opacity:.2},[-1,0,0],null,[1,1.2,1]));
 shapes.add(sdf({type:T.CAPSULE,radius:.2,color:new THREE.Color(0,.2,.4),displace:new THREE.Vector3(0,0,.1)},[1,-.3,0],[0,0,.8],[1,.9,1]));
 shapes.add(sdf({type:T.INFINITE_CONE,radius:.3,color:new THREE.Color(.2,.2,0)},[0,1.2,0],[Math.PI/2,0,0]));
 scene.add(shapes);
 const all=new SplatEdit({rgbaBlendMode:B.MULTIPLY});
 all.add(sdf({type:T.ALL,color:new THREE.Color(.95,1,.9)},[0,0,0]));
 scene.add(all);
 return [union,shapes];
}

async function runEditCase(config){
 let seed=7;const random=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296;};
 const native=config.engine!=='webgl';
 const renderer=native?new WebGPURenderer({antialias:false,alpha:true}):new THREE.WebGLRenderer({antialias:false,alpha:true,preserveDrawingBuffer:true});
 if(native)await renderer.init();
 renderer.setPixelRatio(1);renderer.setSize(W,H);document.body.append(renderer.domElement);
 if(native)renderer.backend.device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 const scene=new THREE.Scene();scene.background=new THREE.Color(0,0,0);
 const camera=new THREE.PerspectiveCamera(60,W/H,.1,1000);camera.position.set(.2,.3,4);camera.lookAt(0,0,0);camera.updateMatrixWorld();
 const spark=new SparkRenderer({renderer,autoUpdate:native,accumExtSplats:!!config.outputExt,
  webgpuSort:config.engine==='gpu-sort'?'radix':'readback',minSortIntervalMs:0});
 scene.add(spark);
 const meshes=[],sources=[];
 for(let m=0;m<2;m++){
  const extended=m===1,constructed=new (extended?ExtSplats:PackedSplats)({maxSplats:COUNT,construct:data=>{
   for(let i=0;i<COUNT;i++)data.pushSplat(new THREE.Vector3((random()-.5)*2.4,(random()-.5)*1.6,(random()-.5)*1.4),
    new THREE.Vector3(.01+random()*.05,.01+random()*.05,.01+random()*.05),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(random()*6,random()*6,random()*6)),.2+random()*.7,new THREE.Color(random(),random(),random()));}});
  await constructed.initialized;
  const source=new (extended?ExtSplats:PackedSplats)(extended?{extArrays:constructed.extArrays,numSplats:COUNT}:{packedArray:constructed.packedArray,numSplats:COUNT});
  await source.initialized;constructed.dispose();sources.push(source);
  const mesh=new SplatMesh(extended?{extSplats:source}:{packedSplats:source});await mesh.initialized;
  mesh.position.set(m?.6:-.6,0,0);mesh.rotation.set(.1,.3*(m+1),0);mesh.scale.setScalar(m?1.1:.9);meshes.push(mesh);scene.add(mesh);
 }
 const moving=buildEdits(scene,meshes);
 const target=native?null:new THREE.WebGLRenderTarget(W,H,{type:THREE.HalfFloatType});
 const quad=target?new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms:{source:{value:target.texture}},depthTest:false,depthWrite:false,blending:THREE.NoBlending,
  vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader:`uniform sampler2D source;varying vec2 vUv;
   void main(){vec4 c=texture2D(source,vUv);vec3 s=c.rgb/max(c.a,1e-6);
    s=mix(12.92*s,1.055*pow(s,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),s));gl_FragColor=vec4(s*c.a,c.a);}`
 })):null;
 const draw=async()=>{
  if(native)await spark.renderAsync(scene,camera);
  else{renderer.setRenderTarget(target);renderer.getDrawingBufferSize(spark.renderSize);await spark.update({scene,camera});
   const until=performance.now()+5000;while(spark.sorting||spark.sortDirty){if(performance.now()>until)throw Error('Sort did not settle');await new Promise(r=>setTimeout(r,1));}
   renderer.render(scene,camera);renderer.setRenderTarget(null);quad.render(renderer);}
 };
 const capture=async()=>{
  await draw();await draw();
  // A WebGPU canvas is only readable in the task that presented it.
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const context=canvas.getContext('2d');context.drawImage(renderer.domElement,0,0);
  const pixels=Array.from(context.getImageData(0,0,W,H).data);
  const current=spark.current,words=current.numSplats*4;let generated;
  if(native){const b=spark.webgpuBackend,d=renderer.backend.device;
   generated=[await readBuffer(d,b.copyGeneratedOutput(),words*4)];
   if(current.extSplats)generated.push(await readBuffer(d,b.copyGeneratedOutput(true),words*4));}
  else{const gl=renderer.getContext(),fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);generated=[];
   const rows=Math.ceil(current.numSplats/2048);
   for(let attachment=0;attachment<(current.extSplats?2:1);attachment++){
    const tex=renderer.properties.get(current.target.textures[attachment]).__webglTexture;
    gl.framebufferTextureLayer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,tex,0,0);
    const data=new Uint32Array(2048*rows*4);gl.readPixels(0,0,2048,rows,gl.RGBA_INTEGER,gl.UNSIGNED_INT,data);generated.push(data.slice(0,words));}
   gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteFramebuffer(fb);}
  const rows=[];
  for(const {base,count} of current.mapping)for(let i=base;i<base+count;i++){
   const s=current.extSplats?utils.decodeExtSplat(generated,i):utils.unpackSplat(generated[0],i);
   rows.push({raw:generated.map(a=>Array.from(a.slice(i*4,i*4+4)).join(',')).join('|'),
    v:[...s.center.toArray(),s.opacity,s.color.r,s.color.g,s.color.b]});
  }
  return {rows,pixels,keyBits:native?spark.webgpuBackend?.gpuSortKeyBits:null};
 };
 try{
  const before=await capture();
  moving[0].position.set(.3,-.2,.1);moving[1].rotation.set(0,.5,0);
  const after=await capture();
  return [before,after];
 }finally{
  if(native)await renderer.backend.device.queue.onSubmittedWorkDone();
  target?.dispose();quad?.material.dispose();quad?.dispose();for(const mesh of meshes)mesh.dispose();for(const s of sources)s.dispose();
  spark.dispose();renderer.dispose();renderer.domElement.remove();
 }
}

const pixelDiff=(a,b)=>{let sum=0,max=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);sum+=d;if(d>max)max=d;}return {mean:sum/a.length,max};};
// 16-bit OneSweep keys quantize depth: near-ties may swap blending order.
const sortMatches=(a,b)=>{const d=pixelDiff(a.pixels,b.pixels);return {ok:d.max===0||(b.keyBits===16&&d.mean<0.05),...d,keyBits:b.keyBits};};
try{
 const stats=[];
 for(const config of [{outputExt:true},{outputExt:false}]){
  const [webgl,reference,radix]=[await runEditCase({...config,engine:'webgl'}),await runEditCase({...config,engine:'webgpu-readback'}),await runEditCase({...config,engine:'gpu-sort'})];
  for(const [phase,step] of [['static',0],['moved',1]]){
   const label=`edits out${config.outputExt?'Ext':'Packed'} ${phase}`,a=webgl[step],b=reference[step];
   // GLSL and WGSL transcendentals (exp, log, sin) differ in the last bit.
   const close=(x,y)=>x.v.every((value,j)=>Math.abs(value-y.v[j])<=(j<3?2e-3*Math.max(1,Math.abs(value)):3/255));
   const mismatch=a.rows.findIndex((row,i)=>!b.rows[i]||!close(row,b.rows[i]));
   const exact=a.rows.filter((row,i)=>row.raw===b.rows[i]?.raw).length;
   check(`${label}: generated splats match WebGL`,mismatch<0&&a.rows.length===b.rows.length&&radix[step].rows.every((row,i)=>row.raw===b.rows[i].raw),
    {mismatch,exact,lengths:[a.rows.length,b.rows.length],webgl:a.rows[mismatch],native:b.rows[mismatch]});
   {const m=sortMatches(b,radix[step]);check(`${label}: native orderings render identically`,m.ok,m);}
   const diff=pixelDiff(a.pixels,b.pixels);
   stats.push({label,splats:a.rows.length,bitExact:exact/a.rows.length,diff});
   check(`${label}: WebGPU renders like WebGL`,diff.mean<1,{diff});
  }
  // The edits really change the splats: moving them changes the output.
  check(`edits out${config.outputExt?'Ext':'Packed'}: moving edits changes output`,webgl[0].rows.some((row,i)=>row.raw!==webgl[1].rows[i].raw));
 }
 window.lifecycleResult={passed:errors.length===0,checks,errors,stats};
}catch(error){window.lifecycleResult={passed:false,checks,errors,error:String(error)};}
</script></body></html>
