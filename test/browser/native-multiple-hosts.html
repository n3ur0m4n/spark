<!doctype html><html><head><link rel="icon" href="data:,"><title>Concurrent native instances and independent hosts</title></head><body><script type="module">
import * as THREE from 'three';
import {WebGPURenderer} from 'three/webgpu';
import {SparkRenderer,SplatMesh} from '/src/index.ts';
const checks=[],errors=[],hosts=[],sparks=[],meshes=[];
const check=(name,ok,data={})=>{checks.push({name,ok,...data});if(!ok)throw Error(name);};
window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
try{
 for(let i=0;i<2;i++){const renderer=new WebGPURenderer({antialias:false});await renderer.init();renderer.setSize(96,96);renderer.backend.device.addEventListener('uncapturederror',e=>errors.push(e.error.message));hosts.push(renderer);}
 const camera=new THREE.PerspectiveCamera(60,1,.1,100);camera.position.z=4;
 const scenes=[];
 for(let i=0;i<3;i++){
  const renderer=hosts[i===2?1:0],spark=new SparkRenderer({renderer,enableLod:false,webgpuSort:'radix'});sparks.push(spark);
  const scene=new THREE.Scene();scene.add(spark);scenes.push(scene);
  const mesh=new SplatMesh({constructSplats:data=>{for(let j=0;j<=i;j++)data.pushSplat(new THREE.Vector3(j*.1,0,0),new THREE.Vector3(.1,.1,.1),new THREE.Quaternion(),1,new THREE.Color(1,0,0));}});await mesh.initialized;meshes.push(mesh);scene.add(mesh);
 }
 await Promise.all(sparks.map((spark,i)=>spark.renderAsync(scenes[i],camera)));
 await Promise.all(hosts.map(h=>h.backend.device.queue.onSubmittedWorkDone()));
 check('concurrent same-host and separate-host instances keep their own counts',JSON.stringify(await Promise.all(sparks.map(async s=>(await s.readRenderStatsAsync()).drawnSplats)))==='[1,2,3]');
 sparks[0].dispose();scenes[0].remove(sparks[0]);
 await sparks[1].renderAsync(scenes[1],camera);
 check('disposing one Spark preserves its same-host peer',(await sparks[1].readRenderStatsAsync()).drawnSplats===2);
 hosts[0].backend.device.destroy();await hosts[0].backend.device.lost;
 check('device loss is scoped to its host',sparks[1].webgpuBackend.deviceLost&&!sparks[2].webgpuBackend.deviceLost);
 await sparks[2].renderAsync(scenes[2],camera);await hosts[1].backend.device.queue.onSubmittedWorkDone();
 check('independent host still renders after other device loss',(await sparks[2].readRenderStatsAsync()).drawnSplats===3);
 check('no unhandled concurrent-instance errors',errors.length===0,{errors});
 window.lifecycleResult={passed:true,checks,errors};
}catch(error){window.lifecycleResult={passed:false,checks,errors,error:String(error)};}
finally{for(const spark of sparks)spark.dispose();for(const mesh of meshes)mesh.dispose();for(const host of hosts)host.dispose();}
</script></body></html>
