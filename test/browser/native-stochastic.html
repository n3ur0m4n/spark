<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Native stochastic parity</title></head><body>
<script type="module">
// stochastic: "on" keeps each fragment with probability alpha, written opaque
// with depth. WebGL (drawn straight to the canvas: stochastic is canvas-only)
// and both native orderings must produce the same dither.
import * as THREE from 'three';
import {WebGPURenderer} from 'three/webgpu';
import {SparkRenderer,SplatMesh,PackedSplats} from '/src/index.ts';
const errors=[],checks=[];
window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
window.addEventListener('error',e=>errors.push(e.message));
const check=(name,ok,data={})=>{checks.push({name,ok,...data});if(!ok)throw Error(`${name}: ${JSON.stringify(data)}`);};
const W=160,H=120,COUNT=6000;

async function runCase(config){
 let seed=5;const random=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296;};
 const native=config.engine!=='webgl';
 const renderer=native?new WebGPURenderer({antialias:false,alpha:true}):new THREE.WebGLRenderer({antialias:false,alpha:true,preserveDrawingBuffer:true});
 if(native)await renderer.init();
 renderer.setPixelRatio(1);renderer.setSize(W,H);document.body.append(renderer.domElement);
 if(native)renderer.backend.device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 renderer.setClearColor(0x000000,0);const scene=new THREE.Scene();
 const camera=new THREE.PerspectiveCamera(60,W/H,.1,1000);camera.position.set(0,0,4);camera.updateMatrixWorld();
 const spark=new SparkRenderer({renderer,autoUpdate:native,stochastic:config.stochastic,
  webgpuSort:config.engine==='gpu-sort'?'radix':'readback',minSortIntervalMs:0});
 scene.add(spark);
 const packedSplats=new PackedSplats({maxSplats:COUNT,construct:data=>{
  for(let i=0;i<COUNT;i++)data.pushSplat(new THREE.Vector3((random()-.5)*3,(random()-.5)*2,(random()-.5)*2),
   new THREE.Vector3(.02+random()*.06,.02+random()*.06,.02+random()*.06),
   new THREE.Quaternion().setFromEuler(new THREE.Euler(random()*6,random()*6,random()*6)),.1+random()*.8,new THREE.Color(random(),random(),random()));}});
 await packedSplats.initialized;
 const mesh=new SplatMesh({packedSplats});await mesh.initialized;scene.add(mesh);
 const draw=async()=>{
  if(native)await spark.renderAsync(scene,camera);
  else{renderer.getDrawingBufferSize(spark.renderSize);await spark.update({scene,camera});
   const until=performance.now()+5000;while(spark.sorting||spark.sortDirty){if(performance.now()>until)throw Error('Sort did not settle');await new Promise(r=>setTimeout(r,1));}
   renderer.render(scene,camera);}
 };
 try{
  await draw();await draw();
  // A WebGPU canvas is only readable in the task that presented it.
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const context=canvas.getContext('2d');context.drawImage(renderer.domElement,0,0);
  return {pixels:Array.from(context.getImageData(0,0,W,H).data)};
 }finally{
  if(native)await renderer.backend.device.queue.onSubmittedWorkDone();
  mesh.dispose();packedSplats.dispose();spark.dispose();renderer.dispose();renderer.domElement.remove();
 }
}

const pixelDiff=(a,b)=>{let sum=0,max=0,count=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);sum+=d;if(d>max)max=d;if(d>8)count++;}return {mean:sum/a.length,max,count};};
try{
 const [webgl,reference,radix,sorted]=[await runCase({engine:'webgl',stochastic:'on'}),await runCase({engine:'webgpu-readback',stochastic:'on'}),
  await runCase({engine:'gpu-sort',stochastic:'on'}),await runCase({engine:'webgpu-readback',stochastic:'off'})];
 // Stochastic output is opaque wherever a fragment survived.
 const translucent=p=>{let n=0;for(let i=3;i<p.length;i+=4)if(p[i]>0&&p[i]<255)n++;return n;};
 const covered=p=>{let n=0;for(let i=3;i<p.length;i+=4)if(p[i]>0)n++;return n;};
 check('native stochastic writes opaque fragments',translucent(reference.pixels)===0&&covered(reference.pixels)>1000,{translucent:translucent(reference.pixels),covered:covered(reference.pixels)});
 check('native stochastic differs from the sorted blend',pixelDiff(reference.pixels,sorted.pixels).mean>1,{diff:pixelDiff(reference.pixels,sorted.pixels)});
 const orderings=pixelDiff(reference.pixels,radix.pixels);
 check('native orderings render alike',orderings.mean<0.05,{orderings});
 const diff=pixelDiff(webgl.pixels,reference.pixels);
 check('WebGPU dither matches WebGL',diff.mean<1,{diff});
 window.lifecycleResult={passed:errors.length===0,checks,errors,stats:[{webglVsNative:diff,orderings,covered:covered(webgl.pixels)}]};
}catch(error){window.lifecycleResult={passed:false,checks,errors,error:String(error)};}
</script></body></html>
